# Updated Kubernetes Deployments with Dapr Integration
# Services: Todo, Agent, MCP Server, Frontend

---
# Todo Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-service
  namespace: evo-todo
  labels:
    app: todo-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-service
  template:
    metadata:
      labels:
        app: todo-service
      annotations:
        # Dapr sidecar injection
        dapr.io/enabled: "true"
        dapr.io/app-id: "todo-service"
        dapr.io/app-port: "8000"
        dapr.io/config: "appconfig"
        dapr.io/log-level: "info"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9090"
    spec:
      containers:
      - name: todo-service
        image: evo-todo/todo-service:latest
        imagePullPolicy: IfNotPresent  # Use Always for production with image registry
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        # Environment variables from ConfigMap and Secrets
        envFrom:
        - configMapRef:
            name: evo-todo-config
        - secretRef:
            name: evo-todo-secrets

        # Resource requests and limits (REQUIRED for HPA)
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

